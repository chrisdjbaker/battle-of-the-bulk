<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle of the Bulk — Tournament Hub</title>
<style>
:root{
  --bg:#09080d; --panel:#16121d; --panel2:#1e1828; --line:#33293f; --line2:#4a3b58;
  --text:#f1e8da; --muted:#a69a8c; --gold:#d9a84e; --gold2:#f5d68f; --blood:#b8322a; --blood2:#ff5a45;
  --ghost:#7fb2ff; --venom:#6fdc8c; --radius:14px; --cw:180px;
  --serif:"Cinzel","Trajan Pro","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
  background:radial-gradient(1100px 520px at 50% -8%,#2c1420 0%,transparent 62%),radial-gradient(900px 500px at 100% 110%,#0f1b30 0%,transparent 60%),var(--bg);
  background-attachment:fixed}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)}
.hidden{display:none!important}
body.display .admin{display:none!important}
body:not(.display) .disp-only{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:16px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,10,16,.9),rgba(9,8,13,.6))}
.logo{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 18px rgba(217,168,78,.35);object-fit:cover;flex:none}
.titles{flex:1;min-width:0}
.venue{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.top h1{font-size:clamp(20px,3vw,30px);background:linear-gradient(180deg,#fff2d6,#d9a84e 60%,#9b6a22);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.sub{font-size:13px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
body.display .logo{width:84px;height:84px}
body.display .top h1{font-size:clamp(26px,4vw,44px)}

nav{display:flex;gap:4px;padding:8px clamp(12px,3vw,28px);overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(12,10,16,.85);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
nav a{padding:9px 14px;border-radius:10px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:600;font-size:14px;border:1px solid transparent}
nav a:hover{color:var(--text);background:var(--panel)}
nav a.on{color:var(--gold2);background:var(--panel2);border-color:var(--line2)}
main{max-width:1280px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 80px}

/* generic */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.sec{font-size:20px;margin:30px 0 14px;color:var(--gold2)}
.sec:first-child{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#f0c873,#b9822f);color:#1a0f05;border-color:#f5d68f}
.btn.gold:hover{filter:brightness(1.08);color:#1a0f05}
.btn.blood{background:linear-gradient(180deg,#d8443a,#86201a);border-color:#ff6b5a;color:#fff}
.btn.danger{color:#ff8a7a}
.btn.danger:hover{border-color:var(--blood2);color:var(--blood2)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea,input:not([type]){background:#0e0b13;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
textarea{width:100%;min-height:80px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--gold);width:16px;height:16px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line2);color:var(--muted)}
.pill.ok{color:var(--venom);border-color:#2f6b40}
.pill.no{color:#ff9a8a;border-color:#6b2f2a}
.pill.gold{color:var(--gold2);border-color:#7a5b22}
.tablewrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel2);font-weight:700}
tr:last-child td{border-bottom:none}
td.num{color:var(--muted);width:40px}
.inline{width:100%;min-width:140px}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--line2);flex:none}
.kitchip{display:flex;align-items:center;gap:8px;min-width:0}
.kitchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* event */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:28px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 240px at 15% 50%,rgba(184,50,42,.25),transparent 70%);pointer-events:none}
.hero-logo{width:170px;height:170px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 40px rgba(217,168,78,.3);object-fit:cover;position:relative}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.display-title{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:4px 0 8px;color:#fff;text-shadow:0 0 24px rgba(255,90,69,.45),0 2px 0 #5a1410}
.tagline{font-family:var(--serif);font-size:18px;color:var(--gold2);margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:12px}
.fact{display:flex;gap:8px;align-items:center}
.slotbar{height:10px;border-radius:99px;background:#0e0b13;border:1px solid var(--line2);overflow:hidden;max-width:460px}
.slotbar div{height:100%;background:linear-gradient(90deg,var(--blood),var(--blood2));box-shadow:0 0 12px var(--blood2)}
.notes{white-space:normal;color:var(--muted);margin:12px 0 0}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.price{text-align:center;padding:22px 16px;position:relative}
.price .amt{font-family:var(--serif);font-size:48px;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(255,90,69,.5)}
.price .plabel{font-family:var(--serif);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold2)}
.price .tag{margin-top:10px}
.kit-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.km{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,#1a1520,#120f17)}
.km img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.km span{font-family:var(--serif);font-size:15px}
.km.taken{opacity:.55}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.posters img{border-radius:12px;border:1px solid var(--line2);cursor:zoom-in;width:100%}

/* players */
.addform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.addform #newName{flex:1 1 220px}
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{padding:14px;text-align:center}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line2);margin-bottom:10px}
.pcard .pn{font-family:var(--serif);font-size:19px;color:#fff}
.pcard .pk{color:var(--gold2);font-size:14px}
.kitcell{min-width:240px}
.kitcell select{max-width:200px}

/* kits */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.kcard{padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.kcard.taken .kimg img{filter:brightness(.85)}
.kimg{position:relative}
.kimg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
.knum{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);border:1px solid var(--gold);color:var(--gold2);font-family:var(--serif);font-weight:700;border-radius:8px;padding:1px 8px;font-size:14px}
.kname{font-family:var(--serif);font-size:17px;color:#fff;min-height:2.6em}
.kowner{font-size:14px}
.avail{color:var(--venom)}
.kactions{display:flex;gap:6px;flex-wrap:wrap}
.kadd{display:grid;place-items:center;min-height:260px;border-style:dashed;cursor:pointer;color:var(--gold2);font-family:var(--serif);font-size:18px}
.kadd:hover{border-color:var(--gold)}

/* draw */
.draw-stage{padding:26px 0 10px;text-align:center}
.draw-controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.reel-wrap{position:relative;margin:0 auto;max-width:1200px}
.reel{position:relative;overflow:hidden;padding:26px 0;border-radius:18px;border:1px solid var(--line2);
  background:linear-gradient(90deg,#07060a 0%,transparent 18%,transparent 82%,#07060a 100%),repeating-linear-gradient(90deg,#120e17 0 2px,#16111c 2px 4px)}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:22%;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#09080d,transparent)}
.reel::after{right:0;background:linear-gradient(270deg,#09080d,transparent)}
.strip{display:flex;position:relative;will-change:transform}
.rc{flex:0 0 var(--cw);width:var(--cw);margin-right:14px;border-radius:14px;padding:10px;background:linear-gradient(180deg,#221b2c,#15111b);border:1px solid var(--line2);transition:border-color .1s}
.rc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}
.rc .rn{font-family:var(--serif);font-size:14px;margin-top:8px;min-height:2.8em;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.rc.hot{border-color:var(--gold)}
.rc.winner{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2),0 0 40px rgba(245,214,143,.6);transform:scale(1.06);transition:all .35s}
.marker{position:absolute;left:50%;top:-14px;bottom:-14px;width:calc(var(--cw) + 16px);transform:translateX(calc(-50% - 7px));border:2px solid var(--gold);border-radius:18px;z-index:3;pointer-events:none;box-shadow:0 0 30px rgba(217,168,78,.35),inset 0 0 30px rgba(217,168,78,.15)}
.marker::before,.marker::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:12px solid transparent}
.marker::before{top:-2px;border-top-color:var(--gold)}
.marker::after{bottom:-2px;border-bottom-color:var(--gold)}
.who{font-family:var(--serif);font-size:24px;min-height:40px;margin:22px 0 8px}
.who b{color:var(--gold2)}
.rolling{color:var(--blood2);text-shadow:0 0 12px rgba(255,90,69,.6)}
.rollbtn{font-family:var(--serif);font-size:22px;letter-spacing:.08em;padding:16px 38px;border-radius:16px;margin-top:8px;box-shadow:0 0 30px rgba(217,168,78,.35)}
.poolinfo{margin-top:12px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px}
.logrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.logrow .t{margin-left:auto;font-size:12px;color:var(--muted)}
body.display{--cw:220px}

/* reveal */
.modal{position:fixed;inset:0;background:rgba(5,3,8,.82);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:60;padding:16px;overflow-y:auto}
.modal-card{background:linear-gradient(180deg,#221a2b,#130f18);border:1px solid var(--line2);border-radius:18px;padding:24px;width:min(560px,100%);position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card.wide{width:min(900px,100%)}
.modal-card.bare{background:none;border:none;box-shadow:none;padding:0;width:auto}
.modal-card h3{margin-bottom:14px;color:var(--gold2)}
.reveal{text-align:center;overflow:hidden}
.reveal .lbl{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.reveal img{width:min(300px,70vw);aspect-ratio:1;object-fit:cover;border-radius:18px;margin:16px auto;border:2px solid var(--gold2);box-shadow:0 0 60px rgba(255,90,69,.5);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.reveal h2{font-size:clamp(26px,4vw,38px);color:#fff;text-shadow:0 0 20px rgba(255,90,69,.6)}
.reveal .for{font-size:18px;margin-top:6px}
.reveal .for b{color:var(--gold2)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.ember{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--blood2);box-shadow:0 0 10px var(--blood2);animation:rise 3s linear infinite;opacity:0;pointer-events:none}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-520px) translateX(30px);opacity:0}}
.modal-actions{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* bracket */
.bracket{display:flex;gap:26px;overflow-x:auto;padding:6px 4px 14px}
.bcol{display:flex;flex-direction:column;min-width:200px;flex:1 0 200px}
.bhead{font-family:var(--serif);color:var(--gold2);text-align:center;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.bmatches{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.match{position:relative;border:1px solid var(--line2);border-radius:10px;background:#120e17;overflow:visible}
.match.click{cursor:pointer}
.match.click:hover{border-color:var(--gold)}
.match.bye{opacity:.45}
.bcol:not(:last-child) .match::after{content:"";position:absolute;right:-14px;top:50%;width:13px;border-top:2px solid var(--line2)}
.bcol:not(:first-child) .match::before{content:"";position:absolute;left:-14px;top:50%;width:13px;border-top:2px solid var(--line2)}
.slot{display:flex;align-items:center;gap:8px;padding:7px 9px;min-height:42px}
.slot+.slot{border-top:1px solid var(--line)}
.slot img{width:28px;height:28px;border-radius:6px;object-fit:cover;flex:none}
.slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.slot .sd{font-size:11px;color:var(--muted);width:16px;text-align:right;flex:none}
.slot .sc{font-weight:800;color:var(--gold2);min-width:14px;text-align:right}
.slot.win{background:linear-gradient(90deg,rgba(217,168,78,.18),transparent)}
.slot.win .nm{color:var(--gold2)}
.slot.lose .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,90,69,.6)}
.slot.tbd .nm{color:var(--muted);font-style:italic;font-weight:400}
.champ-box{border:2px solid var(--gold);border-radius:14px;padding:16px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(217,168,78,.25),transparent 70%),#140f18;box-shadow:0 0 30px rgba(217,168,78,.25)}
.champ-box img{width:110px;height:110px;border-radius:12px;object-fit:cover;margin:8px auto}
.champ-box .cn{font-family:var(--serif);font-size:20px;color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--panel2);border-color:var(--gold);color:var(--gold2)}
.pairing{display:grid;grid-template-columns:40px 1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.pairing.click{cursor:pointer}
.pairing.click:hover{border-color:var(--gold)}
.pairing .tbl{color:var(--muted);font-size:13px}
.pairing .res{font-weight:800;color:var(--gold2);text-align:center;min-width:64px}
.pairing .pl{display:flex;align-items:center;gap:8px;min-width:0}
.pairing .pl.r{justify-content:flex-end;text-align:right}
.pairing .pl.win .nm{color:var(--gold2)}
.pairing .pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.partlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin:10px 0 18px}

/* match modal */
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:12px;border:2px solid var(--line2);background:#120e17;cursor:pointer;font-weight:700;font-size:16px}
.pick img{width:90px;height:90px;border-radius:10px;object-fit:cover}
.pick.sel{border-color:var(--gold2);box-shadow:0 0 20px rgba(245,214,143,.35);color:var(--gold2)}
.vs{align-self:center;font-family:var(--serif);font-size:22px;color:var(--blood2)}
.games{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px}
.games input{width:70px;text-align:center}

/* results */
.champion{text-align:center;padding:34px 20px;position:relative;overflow:hidden;border-color:var(--gold)}
.champion img{width:180px;height:180px;border-radius:18px;object-fit:cover;margin:14px auto;border:2px solid var(--gold2);box-shadow:0 0 50px rgba(217,168,78,.45)}
.champion h2{font-size:clamp(30px,5vw,48px);color:#fff;text-shadow:0 0 24px rgba(217,168,78,.6)}
.place{font-family:var(--serif);font-weight:700;color:var(--gold2);white-space:nowrap}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.prow{display:grid;grid-template-columns:90px 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.postlist{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.postlist .pi{position:relative}
.postlist img{height:150px;border-radius:8px;border:1px solid var(--line2)}
.postlist .btn{position:absolute;top:6px;right:6px}
.help{font-size:14px;color:var(--muted)}
.help b{color:var(--text)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#241c2e;border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:12px;z-index:80;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--blood2)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr;text-align:center;padding:20px}
  .hero-logo{width:120px;height:120px;margin:0 auto}
  .facts{justify-content:center}
  .slotbar{margin:0 auto}
  .logo{width:46px;height:46px}
  .top{flex-wrap:wrap}
  :root{--cw:140px}
  .pairing{grid-template-columns:1fr auto 1fr}
  .pairing .tbl{display:none}
  .mm{grid-template-columns:1fr}
  .vs{text-align:center}
  .prow{grid-template-columns:70px 1fr}
}
@media print{nav,.top-actions,.admin{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header class="top">
  <img id="logo" class="logo" alt="">
  <div class="titles">
    <div class="venue" id="hVenue"></div>
    <h1 id="hName"></h1>
    <div class="sub" id="hSub"></div>
  </div>
  <div class="top-actions">
    <button class="btn ghost" data-act="toggleSound" id="soundBtn" title="Sound on/off">🔊</button>
    <button class="btn ghost disp-only" data-act="fullscreen">⛶ Fullscreen</button>
    <button class="btn ghost admin" data-act="openTV" title="Open a second window for a TV or projector. It updates live.">📺 TV display</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>

<script>/*__ASSETS__*/</script>
<script>
"use strict";
/* ================= Helpers ================= */
const KEY = 'botb-tournament-v1';
const BYE = '__BYE__';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const real = id => id && id !== BYE;
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1b1622"/><text x="50" y="66" font-size="50" text-anchor="middle" fill="#d9a84e" font-family="Georgia">?</text></svg>');
const img = ref => (ref && ref.startsWith('asset:')) ? (ASSETS[ref.slice(6)] || PH) : (ref || PH);

/* ================= State ================= */
const DEFAULT_KITS = ["Haunting of Thraben","Restless Spirits","The Stitcher's Laboratory","Rise of the Skaabs","Voldaren Blood Feast","Madness at Midnight","Howl of the Pack","Night of the Werewolves","Coven of the Harvest","Dawnhart Survivors","Blessed and Buried","Storm over Innistrad","Things Beneath the Soil","Torches of Thraben","Secrets of the Deep Woods"];
const defaultKits = () => DEFAULT_KITS.map((n, i) => { const a = 'asset:kit' + String(i + 1).padStart(2, '0'); return { id: 'k' + (i + 1), name: n, img: a, defaultImg: a }; });
function defaultState() {
  return {
    version: 1,
    event: { name: 'Halloween Battle of the Bulk', venue: 'The Colosseum Gaming Lounge', address: '121 E 6th St, Rusk, TX', date: '', time: '', maxSlots: 15, tagline: '15 themed kits await… Which one will you pull?', notes: '' },
    logo: 'asset:logo',
    posters: ['asset:kitsPoster', 'asset:pricingPoster'],
    pricing: [
      { id: 'p5', label: 'Standard Admission', price: 5, entry: false },
      { id: 'p10', label: 'Battle of the Bulk Tournament Entry', price: 10, entry: true },
      { id: 'p20', label: 'Tournament Entry + Deck-Themed Sleeves + Deck Box', price: 20, entry: true },
    ],
    kits: defaultKits(),
    players: [],
    draw: { removeDrawn: true, log: [], live: null },
    t: { format: 'single', seeding: 'random', swissRounds: 4, cut: 4, bestOf: 3, stage: 'setup', participants: [], dropped: [], swiss: null, elim: null },
    ui: { sound: true },
  };
}
function load() {
  const d = defaultState();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); return { ...d, ...s, event: { ...d.event, ...s.event }, draw: { ...d.draw, ...s.draw }, t: { ...d.t, ...s.t }, ui: { ...d.ui, ...s.ui } }; }
  } catch (e) { console.warn(e); }
  return d;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast('⚠️ Could not save — browser storage is full. Use smaller photos or remove a poster.', true); return false; }
}
function commit() { save(); render(); }

const kitById = id => S.kits.find(k => k.id === id);
const playerById = id => S.players.find(p => p.id === id);
const ownerOf = kitId => S.players.find(p => p.kitId === kitId);
const pname = id => id === BYE ? 'BYE' : (playerById(id)?.name || (id ? '(removed)' : 'TBD'));
const pkitImg = id => { const p = playerById(id); const k = p && kitById(p.kitId); return k ? img(k.img) : PH; };
const tierById = id => S.pricing.find(t => t.id === id);

/* ================= Sound ================= */
let audio = null;
function ac() {
  if (!S.ui.sound) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(freq, dur, type = 'square', vol = .04, when = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  tick: () => tone(1500, .03, 'square', .02),
  name: () => tone(620, .04, 'triangle', .04),
  chosen: () => { tone(330, .25, 'triangle', .08); tone(495, .3, 'triangle', .06, .08); },
  win: () => { [392, 494, 587, 784, 988].forEach((f, i) => tone(f, .7, 'triangle', .08, i * .09)); tone(82, 1.6, 'sawtooth', .05); },
};

/* ================= Toast / modal ================= */
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3200); }
let modalKind = null;
function openModal(html, cls = '', kind = 'generic') { $('#modalCard').className = 'modal-card ' + cls; $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden'); modalKind = kind; }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalCard').innerHTML = ''; modalKind = null; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || modalKind === 'zoom') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalKind) closeModal(); });

/* ================= Routing ================= */
const VIEWS = {
  event: ['🏰 Event', viewEvent],
  players: ['🧙 Contestants', viewPlayers],
  draw: ['🎲 Kit Draw', viewDraw],
  kits: ['🃏 Kits', viewKits],
  bracket: ['⚔️ Bracket', viewBracket],
  results: ['🏆 Results', viewResults],
  settings: ['⚙️ Settings', viewSettings],
};
const isDisplay = () => location.hash.startsWith('#display');
function currentView() {
  const h = location.hash.replace('#', '');
  const v = h.startsWith('display') ? (h.split(':')[1] || 'event') : (h || 'event');
  if (isDisplay() && v === 'settings') return 'event';
  return VIEWS[v] ? v : 'event';
}
const hrefFor = v => '#' + (isDisplay() ? 'display:' + v : v);
function go(v) { if (currentView() !== v) history.replaceState(null, '', hrefFor(v)); }
window.addEventListener('hashchange', () => render());

/* ================= Render ================= */
let spinning = false, pendingRender = false;
function render() {
  if (spinning) { pendingRender = true; return; }
  document.body.classList.toggle('display', isDisplay());
  const e = S.event, v = currentView();
  document.title = `${e.name} — ${VIEWS[v][0].replace(/^\S+\s/, '')}`;
  $('#logo').src = img(S.logo);
  $('#hVenue').textContent = e.venue;
  $('#hName').textContent = e.name;
  $('#hSub').textContent = [fmtDate(e.date), e.time, e.address].filter(Boolean).join(' · ');
  $('#soundBtn').textContent = S.ui.sound ? '🔊' : '🔇';
  $('#nav').innerHTML = Object.entries(VIEWS).filter(([k]) => !(isDisplay() && k === 'settings'))
    .map(([k, [label]]) => `<a href="${hrefFor(k)}" class="${k === v ? 'on' : ''}">${label}</a>`).join('');
  $('#main').innerHTML = VIEWS[v][1]();
  if (v === 'draw') layoutStaticReel();
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-').map(Number);
  if (!y) return d;
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

/* ================= Event view ================= */
function viewEvent() {
  const e = S.event, n = S.players.length, max = Math.max(1, +e.maxSlots || 0);
  const left = Math.max(0, max - n), pct = Math.min(100, n / max * 100);
  return `
  <section class="hero card">
    <img class="hero-logo" src="${img(S.logo)}" alt="">
    <div style="position:relative">
      <div class="eyebrow">${esc(e.venue)} presents</div>
      <h2 class="display-title">${esc(e.name)}</h2>
      ${e.tagline ? `<p class="tagline">${esc(e.tagline)}</p>` : ''}
      <div class="facts">
        ${e.date || e.time ? `<div class="fact">📅 ${esc([fmtDate(e.date), e.time].filter(Boolean).join(' at '))}</div>` : ''}
        ${e.address ? `<div class="fact">📍 ${esc(e.address)}</div>` : ''}
        <div class="fact">🎟️ <b>${left}</b>&nbsp;of ${max} slots remaining</div>
      </div>
      <div class="slotbar"><div style="width:${pct}%"></div></div>
      ${e.notes ? `<p class="notes">${esc(e.notes).replace(/\n/g, '<br>')}</p>` : ''}
    </div>
  </section>
  <h3 class="sec">Event Pricing</h3>
  <div class="prices">${S.pricing.map(p => `
    <div class="price card"><div class="amt">$${esc(p.price)}</div><div class="plabel">${esc(p.label)}</div>
    ${p.entry ? '<div class="tag"><span class="pill gold">Tournament entry</span></div>' : ''}</div>`).join('')}
  </div>
  <h3 class="sec">${S.kits.length} Themed Kits Await…</h3>
  <div class="kit-mini">${S.kits.map((k, i) => `
    <div class="km ${ownerOf(k.id) ? 'taken' : ''}"><img src="${img(k.img)}" alt=""><span>${i + 1}. ${esc(k.name)}</span></div>`).join('')}
  </div>
  ${S.posters.length ? `<h3 class="sec">Posters</h3>
  <div class="posters">${S.posters.map((p, i) => `<img src="${img(p)}" alt="Event poster" data-act="zoom" data-i="${i}">`).join('')}</div>` : ''}`;
}

/* ================= Players view ================= */
function tierOptions(sel) {
  const tiers = S.pricing.filter(t => t.entry);
  return (tiers.length ? tiers : S.pricing).map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>$${esc(t.price)} — ${esc(t.label)}</option>`).join('');
}
function viewPlayers() {
  const max = +S.event.maxSlots || 0, n = S.players.length;
  const collected = S.players.filter(p => p.paid).reduce((s, p) => s + (+tierById(p.tier)?.price || 0), 0);
  const owed = S.players.filter(p => !p.paid).reduce((s, p) => s + (+tierById(p.tier)?.price || 0), 0);
  let html = `
  <div class="card addform admin">
    <input id="newName" type="text" placeholder="Contestant name" autocomplete="off">
    <select id="newTier">${tierOptions()}</select>
    <label class="chk"><input type="checkbox" id="newPaid" checked> Paid</label>
    <button class="btn gold" data-act="addPlayer">+ Add contestant</button>
  </div>
  <div class="meter">
    <span class="pill ${n >= max ? 'no' : 'gold'}">${n} / ${max} slots filled</span>
    <span class="pill">${S.players.filter(p => p.kitId).length} kits handed out</span>
    <span class="pill ok admin">$${collected} collected</span>
    ${owed ? `<span class="pill no admin">$${owed} unpaid</span>` : ''}
  </div>`;
  if (!n) return html + `<div class="card empty"><div class="big">🕯️</div>No contestants yet.<span class="admin"> Add the first challenger above.</span></div>`;

  html += `<div class="tablewrap admin"><table>
    <thead><tr><th>#</th><th>Name</th><th>Entry</th><th>Paid</th><th>Kit</th><th></th></tr></thead><tbody>
    ${S.players.map((p, i) => {
      const k = kitById(p.kitId);
      return `<tr>
        <td class="num">${i + 1}</td>
        <td><input class="inline" type="text" value="${esc(p.name)}" data-change="pName" data-id="${p.id}"></td>
        <td><select data-change="pTier" data-id="${p.id}">${tierOptions(p.tier)}</select></td>
        <td><label class="chk"><input type="checkbox" data-change="pPaid" data-id="${p.id}" ${p.paid ? 'checked' : ''}> ${p.paid ? '<span class="pill ok">Paid</span>' : '<span class="pill no">Unpaid</span>'}</label></td>
        <td class="kitcell"><div class="row">
          ${k ? `<div class="kitchip"><img class="thumb" src="${img(k.img)}" alt=""><span>${esc(k.name)}</span></div>` : '<span class="muted">Not drawn yet</span>'}
          ${k ? '' : `<button class="btn sm gold" data-act="drawFor" data-id="${p.id}">🎲 Draw</button>`}
          <select data-change="pKit" data-id="${p.id}" title="Manually set kit">
            <option value="">${k ? '— change / clear —' : '— set manually —'}</option>
            ${S.kits.map(kk => { const o = ownerOf(kk.id); return `<option value="${kk.id}" ${kk.id === p.kitId ? 'selected' : ''}>${esc(kk.name)}${o && o.id !== p.id ? ' (has: ' + esc(o.name) + ')' : ''}</option>`; }).join('')}
          </select></div>
        </td>
        <td><button class="btn sm danger" data-act="delPlayer" data-id="${p.id}" title="Remove">✕</button></td>
      </tr>`;
    }).join('')}
    </tbody></table></div>
  <div class="pgrid disp-only">${S.players.map(p => {
    const k = kitById(p.kitId);
    return `<div class="pcard card"><img src="${k ? img(k.img) : PH}" alt=""><div class="pn">${esc(p.name)}</div><div class="pk">${k ? esc(k.name) : '<span class="muted">Awaiting the draw…</span>'}</div></div>`;
  }).join('')}</div>`;
  return html;
}

/* ================= Draw view ================= */
let drawForSel = null;
function drawPool(playerId) {
  if (!S.draw.removeDrawn) return [...S.kits];
  return S.kits.filter(k => { const o = ownerOf(k.id); return !o || o.id === playerId; });
}
function reelCard(k) { return `<div class="rc"><img src="${img(k?.img)}" alt=""><div class="rn">${esc(k?.name || '?')}</div></div>`; }
function viewDraw() {
  const unassigned = S.players.filter(p => !p.kitId), assigned = S.players.filter(p => p.kitId);
  if (drawForSel === null || (drawForSel && drawForSel !== '__random' && drawForSel !== '__none' && !playerById(drawForSel))) drawForSel = unassigned.length ? '__random' : '__none';
  if (drawForSel === '__random' && !unassigned.length) drawForSel = '__none';
  const pool = drawPool(drawForSel.startsWith('__') ? null : drawForSel);
  const log = [...S.draw.log].reverse();
  return `
  <div class="draw-stage">
    <div class="draw-controls admin">
      <label class="field" style="flex-direction:row;align-items:center;gap:10px"><span>Drawing for</span>
        <select data-change="drawFor" id="drawFor">
          ${unassigned.length ? `<option value="__random" ${drawForSel === '__random' ? 'selected' : ''}>🎲 Random contestant (no kit yet)</option>` : ''}
          ${unassigned.length ? `<optgroup label="Needs a kit">${unassigned.map(p => `<option value="${p.id}" ${drawForSel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : ''}
          ${assigned.length ? `<optgroup label="Already has a kit (re-draw)">${assigned.map(p => `<option value="${p.id}" ${drawForSel === p.id ? 'selected' : ''}>${esc(p.name)} — ${esc(kitById(p.kitId)?.name)}</option>`).join('')}</optgroup>` : ''}
          <option value="__none" ${drawForSel === '__none' ? 'selected' : ''}>Nobody — just roll for fun</option>
        </select></label>
      <label class="chk"><input type="checkbox" data-change="removeDrawn" ${S.draw.removeDrawn ? 'checked' : ''}> Remove kits already handed out from the pool</label>
    </div>
    <div class="reel-wrap"><div class="marker"></div>
      <div class="reel" id="reel"><div class="strip" id="strip">${pool.map(reelCard).join('')}</div></div>
    </div>
    <div class="who" id="drawWho">${pool.length ? (isDisplay() ? 'Which one will you pull?' : '') : '<span class="rolling">Every kit has been claimed!</span>'}</div>
    <button class="btn gold rollbtn admin" id="rollBtn" data-act="roll" ${pool.length ? '' : 'disabled'}>🎲 Roll the Bones</button>
    <div class="poolinfo">${pool.length} kit${pool.length === 1 ? '' : 's'} in the pool · ${unassigned.length} contestant${unassigned.length === 1 ? '' : 's'} still need a kit</div>
  </div>
  ${log.length ? `<h3 class="sec">Draw history</h3><div class="log">${log.map((l, i) => `
    <div class="logrow"><img class="thumb" src="${img(kitById(l.kitId)?.img)}" alt="">
      <div><b>${esc(l.playerId ? pname(l.playerId) : 'Just for fun')}</b> → ${esc(kitById(l.kitId)?.name || '(removed kit)')}</div>
      <span class="t">${new Date(l.time).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span></div>`).join('')}</div>` : ''}`;
}
function layoutStaticReel() {
  const reel = $('#reel'), strip = $('#strip');
  if (!reel || !strip || !strip.children.length) return;
  const cards = strip.children, cw = cards[0].offsetWidth;
  const step = cards[1] ? cards[1].offsetLeft - cards[0].offsetLeft : cw;
  const mid = Math.floor((cards.length - 1) / 2);
  strip.style.transform = `translate3d(${reel.clientWidth / 2 - (mid * step + cw / 2)}px,0,0)`;
}
window.addEventListener('resize', () => { if (!spinning && currentView() === 'draw') layoutStaticReel(); });

let lastLiveSeq = S.draw.live?.seq || null;
function startRoll() {
  if (spinning) return;
  const unassigned = S.players.filter(p => !p.kitId);
  let playerId = null, random = false;
  if (drawForSel === '__random') {
    if (!unassigned.length) return toast('Everyone already has a kit!');
    playerId = unassigned[rand(unassigned.length)].id; random = true;
  } else if (drawForSel && drawForSel !== '__none') playerId = drawForSel;
  const pool = drawPool(playerId);
  if (!pool.length) return toast('No kits left in the pool.', true);
  const target = pool[rand(pool.length)];
  const strip = [];
  const N = Math.max(46, pool.length * 4);
  while (strip.length < N) strip.push(...shuffle(pool).map(k => k.id));
  strip.length = N;
  const targetIdx = N - 4;
  strip[targetIdx] = target.id;
  if (pool.length > 1) for (const j of [targetIdx - 1, targetIdx + 1]) if (strip[j] === target.id) strip[j] = pool.find(k => k.id !== target.id).id;
  const live = {
    seq: Date.now() + '-' + uid(), strip, targetIdx, kitId: target.id, playerId, random,
    names: random ? unassigned.map(p => p.id) : null, jitter: (rand(1000) / 1000 - .5) * .6, duration: 6500,
  };
  S.draw.live = live; lastLiveSeq = live.seq;
  save();
  playLive(live, true);
}
async function nameRoulette(live) {
  const who = $('#drawWho');
  const names = shuffle(live.names.map(id => pname(id)));
  const end = performance.now() + 2000;
  let delay = 55, i = 0;
  while (performance.now() < end) {
    who.innerHTML = `<span class="rolling">${esc(names[i++ % names.length])}</span>`;
    sfx.name(); await sleep(delay); delay *= 1.1;
  }
  who.innerHTML = `Drawing for <b>${esc(pname(live.playerId))}</b>`;
  sfx.chosen(); await sleep(900);
}
function spinReel(live) {
  return new Promise(resolve => {
    const reel = $('#reel'), strip = $('#strip');
    strip.innerHTML = live.strip.map(id => reelCard(kitById(id))).join('');
    const cards = strip.children, cw = cards[0].offsetWidth;
    const step = cards[1] ? cards[1].offsetLeft - cards[0].offsetLeft : cw;
    const center = reel.clientWidth / 2;
    const posFor = idx => center - (idx * step + cw / 2);
    const start = posFor(1), end = posFor(live.targetIdx) + live.jitter * cw;
    const t0 = performance.now(); let lastIdx = -1;
    strip.style.transform = `translate3d(${start}px,0,0)`;
    function frame(now) {
      const t = Math.min(1, (now - t0) / live.duration);
      const e = 1 - Math.pow(1 - t, 4);
      const x = start + (end - start) * e;
      strip.style.transform = `translate3d(${x}px,0,0)`;
      const idx = Math.round((center - x - cw / 2) / step);
      if (idx !== lastIdx) { cards[lastIdx]?.classList.remove('hot'); cards[idx]?.classList.add('hot'); lastIdx = idx; sfx.tick(); }
      if (t < 1) requestAnimationFrame(frame);
      else { cards[lastIdx]?.classList.remove('hot'); cards[live.targetIdx].classList.add('winner'); setTimeout(resolve, 1100); }
    }
    requestAnimationFrame(frame);
  });
}
async function playLive(live, origin) {
  closeModal();
  spinning = false;
  go('draw');
  render();
  spinning = true;
  $('#rollBtn') && ($('#rollBtn').disabled = true);
  ac();
  const who = $('#drawWho');
  if (live.random) await nameRoulette(live);
  else who.innerHTML = live.playerId ? `Drawing for <b>${esc(pname(live.playerId))}</b>` : 'The fates are choosing…';
  await spinReel(live);
  if (origin) {
    const p = playerById(live.playerId);
    live.prevKitId = p ? (p.kitId || null) : null;
    if (p) p.kitId = live.kitId;
    S.draw.log.push({ playerId: live.playerId, kitId: live.kitId, time: Date.now() });
    save();
    if (drawForSel !== '__none') drawForSel = null;
  }
  sfx.win();
  spinning = false; pendingRender = false;
  render();
  showReveal(live, origin);
}
function showReveal(live, origin) {
  const k = kitById(live.kitId);
  const embers = Array.from({ length: 26 }, () => `<span class="ember" style="left:${rand(100)}%;animation-delay:${(rand(3000) / 1000).toFixed(2)}s;animation-duration:${(2.2 + rand(2000) / 1000).toFixed(2)}s"></span>`).join('');
  const more = S.players.some(p => !p.kitId);
  openModal(`<div class="reveal">${embers}
    <div class="lbl">The fates have chosen</div>
    <img src="${img(k?.img)}" alt="">
    <h2>${esc(k?.name)}</h2>
    ${live.playerId ? `<div class="for">for <b>${esc(pname(live.playerId))}</b></div>` : ''}
    <div class="modal-actions ${origin ? '' : 'hidden'}">
      ${more ? '<button class="btn gold" data-act="nextDraw">🎲 Next draw</button>' : ''}
      <button class="btn" data-act="closeModal">Done</button>
      ${live.playerId ? '<button class="btn danger" data-act="undoDraw">↶ Undo this draw</button>' : ''}
    </div></div>`, '', 'reveal');
  if (!origin) setTimeout(() => { if (modalKind === 'reveal' && S.draw.live?.seq === live.seq) closeModal(); }, 12000);
}

/* ================= Kits view ================= */
function viewKits() {
  return `
  <div class="row-between admin" style="margin-bottom:14px">

/* ================= Tournament logic ================= */
function seedOrder(n) { let o = [1]; while (o.length < n) { const m = o.length * 2; o = o.flatMap(s => [s, m + 1 - s]); } return o; }
function buildElim(ids) {
  let size = 2; while (size < ids.length) size *= 2;
  return { size, slots: seedOrder(size).map(s => ids[s - 1] || null), seeds: ids, results: {} };
}
function elimRounds(E) {
  const R = Math.log2(E.size), rounds = [];
  let entrants = E.slots.map(x => x || BYE);
  for (let r = 0; r < R; r++) {
    const ms = [];
    for (let i = 0; i < entrants.length / 2; i++) {
      const a = entrants[2 * i], b = entrants[2 * i + 1], key = `${r}-${i}`;
      let winner = null, res = null;
      if (a === BYE && b === BYE) winner = BYE;
      else if (a === BYE) winner = b;
      else if (b === BYE) winner = a;
      else if (a && b) { res = E.results[key]; if (res && (res.winner === a || res.winner === b)) winner = res.winner; else res = null; }
      const loser = real(winner) && real(a) && real(b) ? (winner === a ? b : a) : null;
      ms.push({ key, a, b, winner, loser, res, isBye: a === BYE || b === BYE });
    }
    rounds.push(ms);
    entrants = ms.map(m => m.winner);
  }
  return rounds;
}
const seedOf = (E, id) => E.seeds.indexOf(id) + 1;
function roundName(r, R) { const left = R - r; return left === 1 ? 'Final' : left === 2 ? 'Semifinals' : left === 3 ? 'Quarterfinals' : `Round ${r + 1}`; }
function elimChampion() { if (!S.t.elim) return null; const rs = elimRounds(S.t.elim); const w = rs[rs.length - 1][0].winner; return real(w) ? w : null; }

function swissStandings() {
  const T = S.t, st = {};
  T.participants.forEach(id => st[id] = { id, pts: 0, w: 0, l: 0, d: 0, gw: 0, gl: 0, played: 0, opps: [], byes: 0 });
  (T.swiss?.rounds || []).forEach(round => round.forEach(m => {
    if (!m.res) return;
    const A = st[m.a], B = st[m.b];
    if (m.b === BYE) { if (A) { A.pts += 3; A.w++; A.gw += 2; A.played++; A.byes++; } return; }
    if (!A || !B) return;
    A.opps.push(m.b); B.opps.push(m.a); A.played++; B.played++;
    A.gw += +m.res.ga || 0; A.gl += +m.res.gb || 0; B.gw += +m.res.gb || 0; B.gl += +m.res.ga || 0;
    if (m.res.winner === 'draw') { A.pts++; B.pts++; A.d++; B.d++; }
    else if (m.res.winner === m.a) { A.pts += 3; A.w++; B.l++; }
    else { B.pts += 3; B.w++; A.l++; }
  }));
  const mwp = s => s.played ? Math.max(1 / 3, s.pts / (3 * s.played)) : 1 / 3;
  const gwp = s => (s.gw + s.gl) ? Math.max(1 / 3, s.gw / (s.gw + s.gl)) : 1 / 3;
  const list = Object.values(st);
  list.forEach(s => {
    s.mwp = mwp(s); s.gwp = gwp(s);
    s.omw = s.opps.length ? s.opps.reduce((a, o) => a + mwp(st[o]), 0) / s.opps.length : 0;
    s.ogw = s.opps.length ? s.opps.reduce((a, o) => a + gwp(st[o]), 0) / s.opps.length : 0;
  });
  return list.sort((a, b) => b.pts - a.pts || b.omw - a.omw || b.gwp - a.gwp || b.ogw - a.ogw || pname(a.id).localeCompare(pname(b.id)));
}
const roundComplete = round => round.every(m => m.res);
function pairRound() {
  const T = S.t, rounds = T.swiss.rounds;
  const played = new Set(), hadBye = new Set();
  rounds.forEach(r => r.forEach(m => { if (m.b === BYE) hadBye.add(m.a); else played.add([m.a, m.b].sort().join('|')); }));
  let list;
  if (!rounds.length) list = T.seeding === 'random' ? shuffle(T.participants) : [...T.participants];
  else {
    const st = swissStandings(), jitter = {};
    st.forEach(s => jitter[s.id] = Math.random());
    list = st.map(s => s).sort((a, b) => b.pts - a.pts || jitter[a.id] - jitter[b.id]).map(s => s.id);
  }
  list = list.filter(id => !T.dropped.includes(id));
  const matches = [];
  if (list.length % 2) {
    let bye = [...list].reverse().find(id => !hadBye.has(id)) || list[list.length - 1];
    list = list.filter(id => id !== bye);
    matches.push({ a: bye, b: BYE, res: { winner: bye, ga: 2, gb: 0 } });
  }
  let budget = 200000;
  const pairUp = (l, avoid) => {
    if (!l.length) return [];
    if (--budget < 0) return null;
    const [a, ...rest] = l;
    for (let j = 0; j < rest.length; j++) {
      if (avoid && played.has([a, rest[j]].sort().join('|'))) continue;
      const sub = pairUp(rest.filter((_, k) => k !== j), avoid);
      if (sub) return [[a, rest[j]], ...sub];
    }
    return null;
  };
  let pairs = pairUp(list, true);
  if (!pairs) { budget = 200000; pairs = pairUp(list, false) || []; }
  rounds.push([...pairs.map(([a, b]) => ({ a, b, res: null })), ...matches]);
  swissRoundView = rounds.length - 1;
}
function tDone() {
  const T = S.t;
  if (T.elim) return !!elimChampion();
  if (T.swiss) return T.swiss.rounds.length >= T.swissRounds && roundComplete(T.swiss.rounds[T.swiss.rounds.length - 1]) && !T.cut;
  return false;
}
function records() {
  const rec = {};
  const get = id => rec[id] || (rec[id] = { w: 0, l: 0, d: 0 });
  (S.t.swiss?.rounds || []).forEach(r => r.forEach(m => {
    if (!m.res || m.b === BYE) return;
    if (m.res.winner === 'draw') { get(m.a).d++; get(m.b).d++; }
    else { get(m.res.winner).w++; get(m.res.winner === m.a ? m.b : m.a).l++; }
  }));
  if (S.t.elim) elimRounds(S.t.elim).flat().forEach(m => { if (real(m.loser)) { get(m.winner).w++; get(m.loser).l++; } });
  return rec;
}
function placements() {
  const T = S.t, out = [], seen = new Set();
  if (T.elim) {
    const rounds = elimRounds(T.elim), R = rounds.length, fin = rounds[R - 1][0];
    if (real(fin.winner)) { out.push({ id: fin.winner, place: 1, label: 'Champion 🏆' }); seen.add(fin.winner); }
    for (let r = R - 1; r >= 0; r--) {
      const place = r === R - 1 ? 2 : 2 ** (R - 1 - r) + 1;
      const label = r === R - 1 ? 'Runner-up' : `${ordinal(place)}–${ordinal(2 ** (R - r))}`;
      rounds[r].forEach(m => { if (real(m.loser) && !seen.has(m.loser)) { out.push({ id: m.loser, place, label }); seen.add(m.loser); } });
    }
  }
  if (T.swiss) {
    const inElim = new Set(T.elim ? T.elim.seeds : []);
    const base = T.elim ? T.elim.seeds.length : 0;
    swissStandings().filter(s => !inElim.has(s.id)).forEach((s, i) => out.push({ id: s.id, place: base + i + 1, label: ordinal(base + i + 1), pts: s.pts }));
  }
  return out;
}

function slotHTML(id, m, side, E) {

/* match modal */
let MM = null;

  if (kind === 'elim') return elimRounds(S.t.elim).flat().find(m => m.key === key);

  return S.t.swiss.rounds[r][i];
}
function openMatch(kind, key) {

  MM = { kind, key, a: m.a, b: m.b, winner: m.res?.winner || null, ga: m.res?.ga ?? '', gb: m.res?.gb ?? '' };
  renderMatchModal();
}
function renderMatchModal() {
  const title = MM.kind === 'elim' ? roundName(+MM.key.split('-')[0], Math.log2(S.t.elim.size)) : `Swiss round ${+MM.key.split('-')[0] + 1}`;
  const pick = side => { const id = MM[side]; return `<button class="pick ${MM.winner === id ? 'sel' : ''}" data-act="pickWin" data-w="${side}"><img src="${pkitImg(id)}" alt="">${esc(pname(id))}<span class="muted" style="font-size:12px;font-weight:400">${MM.winner === id ? '👑 Winner' : 'Tap if they won'}</span></button>`; };

    ${MM.kind === 'swiss' ? `<div style="text-align:center;margin-top:12px"><button class="btn ${MM.winner === 'draw' ? 'gold' : ''}" data-act="pickWin" data-w="draw">🤝 Draw</button></div>` : ''}

}
function saveMatch(clear) {

  const wasChamp = elimChampion();

    ${pl.map(p => { const r = rec[p.id] || { w: 0, l: 0, d: 0 }; const k = kitById(playerById(p.id)?.kitId);
      const st = T.swiss ? swissStandings().find(s => s.id === p.id) : null;
      return `<tr><td class="place">${esc(p.label)}</td><td><b>${esc(pname(p.id))}</b></td>
        <td><div class="kitchip"><img class="thumb" src="${pkitImg(p.id)}" alt=""><span>${esc(k?.name || '—')}</span></div></td>
        <td>${r.w}-${r.l}${r.d ? '-' + r.d : ''}</td>${T.swiss ? `<td>${st ? st.pts : ''}</td>` : ''}</tr>`; }).join('')}
    </tbody></table></div>`;
  const log = [];
  (T.swiss?.rounds || []).forEach((r, ri) => r.forEach(m => { if (m.res && m.b !== BYE) log.push({ round: `Swiss R${ri + 1}`, ...m }); }));
  if (T.elim) { const rs = elimRounds(T.elim); rs.forEach((ms, ri) => ms.forEach(m => { if (m.res && real(m.loser)) log.push({ round: roundName(ri, rs.length), ...m }); })); }
  if (log.length) html += `<h3 class="sec">Match log</h3><div class="tablewrap"><table><thead><tr><th>Round</th><th>Match</th><th>Result</th></tr></thead><tbody>
    ${log.map(m => `<tr><td class="muted">${esc(m.round)}</td><td>${esc(pname(m.a))} vs ${esc(pname(m.b))}</td>
      <td>${m.res.winner === 'draw' ? 'Draw' : '<b>' + esc(pname(m.res.winner)) + '</b> wins'}${m.res.ga != null && m.res.gb != null ? ` (${m.res.ga}-${m.res.gb})` : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
  return html;
}

/* ================= Image upload ================= */
function readImage(file, max = 420, q = .86) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        const g = c.getContext('2d'); g.fillStyle = '#16121d'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.onerror = () => rej(new Error('Could not read that image'));
      im.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
async function withImage(el, max, q, apply) {
  const f = el.files[0]; if (!f) return;
  try { const data = await readImage(f, max, q); const before = JSON.stringify(S); apply(data); if (!save()) { S = JSON.parse(before); } render(); }
  catch (err) { toast('⚠️ ' + err.message, true); }
}

/* ================= Actions ================= */
const ACT = {
  closeModal: () => closeModal(),
  toggleSound: () => { S.ui.sound = !S.ui.sound; commit(); if (S.ui.sound) sfx.chosen(); },
  fullscreen: () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); },
  openTV: () => { window.open(location.href.split('#')[0] + '#display:' + currentView(), 'botb-tv', 'width=1280,height=800'); },
  zoom: el => openModal(`<img src="${img(S.posters[+el.dataset.i])}" style="max-height:88vh;border-radius:12px" alt="">`, 'bare', 'zoom'),
  addPlayer: () => {
    const name = $('#newName').value.trim();
    if (!name) { $('#newName').focus(); return toast('Type a name first.'); }
    if (S.players.length >= +S.event.maxSlots && !confirm(`All ${S.event.maxSlots} slots are full. Add ${name} anyway?`)) return;
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase()) && !confirm(`There's already a "${name}". Add another?`)) return;
    S.players.push({ id: uid(), name, tier: $('#newTier').value, paid: $('#newPaid').checked, kitId: null });
    commit(); $('#newName').focus(); toast(`🧙 ${name} has entered the Colosseum`);
  },
  delPlayer: el => { const p = playerById(el.dataset.id); if (p && confirm(`Remove ${p.name}?${p.kitId ? ' Their kit goes back in the pool.' : ''}`)) { S.players = S.players.filter(x => x !== p); commit(); } },
  drawFor: el => { drawForSel = el.dataset.id; history.replaceState(null, '', hrefFor('draw')); render(); },
  roll: () => startRoll(),
  nextDraw: () => { closeModal(); drawForSel = null; render(); startRoll(); },
  undoDraw: () => {
    const live = S.draw.live; const p = live && playerById(live.playerId);
    if (p) p.kitId = live.prevKitId || null;
    S.draw.log.pop(); closeModal(); drawForSel = p ? p.id : null; commit(); toast('Draw undone — kit returned to the pool');
  },
  kAdd: () => { S.kits.push({ id: 'k' + uid(), name: 'New kit ' + (S.kits.length + 1), img: null }); commit(); const ins = document.querySelectorAll('[data-change="kName"]'); ins[ins.length - 1]?.select(); },
  kDel: el => { const k = kitById(el.dataset.id), o = ownerOf(k.id); if (!confirm(`Delete "${k.name}"?${o ? ` ${o.name} will lose this kit.` : ''}`)) return; S.kits = S.kits.filter(x => x !== k); S.players.forEach(p => { if (p.kitId === k.id) p.kitId = null; }); commit(); },
  kMove: el => { const i = S.kits.findIndex(k => k.id === el.dataset.id), j = i + +el.dataset.dir; if (j < 0 || j >= S.kits.length) return; [S.kits[i], S.kits[j]] = [S.kits[j], S.kits[i]]; commit(); },
  kImgReset: el => { const k = kitById(el.dataset.id); k.img = k.defaultImg; commit(); },
  kitsReset: () => { if (!confirm('Restore the original 15 Halloween kit names and icons? Custom kits will be removed.')) return; S.kits = defaultKits(); S.players.forEach(p => { if (!kitById(p.kitId)) p.kitId = null; }); commit(); toast('Original kits restored'); },
  startT: () => {
    const ids = S.players.filter(p => document.getElementById('part-' + p.id)?.checked).map(p => p.id);
    if (ids.length < 2) return toast('Need at least 2 players.', true);
    const T = S.t; T.participants = ids; T.dropped = []; T.swiss = null; T.elim = null;
    if (T.format === 'single') { T.elim = buildElim(T.seeding === 'random' ? shuffle(ids) : ids); T.stage = 'elim'; }
    else { T.swiss = { rounds: [] }; T.stage = 'swiss'; pairRound(); }
    commit(); toast('⚔️ Let the battle begin!');
  },
  resetT: () => { if (!confirm('Reset the tournament? All brackets and match results will be cleared (contestants and kits stay).')) return; Object.assign(S.t, { stage: 'setup', swiss: null, elim: null, participants: [], dropped: [] }); commit(); },
  openMatch: el => openMatch(el.dataset.kind, el.dataset.key),
  pickWin: el => { MM.ga = $('#ga').value; MM.gb = $('#gb').value; MM.winner = el.dataset.w === 'draw' ? 'draw' : MM[el.dataset.w];
    const need = Math.ceil(+S.t.bestOf / 2);
    if (MM.winner === MM.a && MM.ga === '' && MM.gb === '') { MM.ga = need; MM.gb = 0; }
    if (MM.winner === MM.b && MM.ga === '' && MM.gb === '') { MM.ga = 0; MM.gb = need; }
    renderMatchModal(); },
  saveMatch: () => saveMatch(false),
  clearMatch: () => saveMatch(true),
  swissView: el => { swissRoundView = +el.dataset.i; render(); },
  nextRound: () => { pairRound(); commit(); },
  extraRound: () => { S.t.swissRounds++; pairRound(); commit(); },
  startCut: () => {
    const T = S.t; const st = swissStandings().filter(s => !T.dropped.includes(s.id));
    const n = Math.min(+T.cut, st.length);
    if (!confirm(`Start a Top ${n} playoff with: ${st.slice(0, n).map(s => pname(s.id)).join(', ')}?`)) return;
    T.elim = buildElim(st.slice(0, n).map(s => s.id)); T.stage = 'elim'; commit();
  },
  toggleDrop: el => { const T = S.t, id = el.dataset.id; T.dropped = T.dropped.includes(id) ? T.dropped.filter(x => x !== id) : [...T.dropped, id]; commit(); },
  prAdd: () => { S.pricing.push({ id: 'p' + uid(), label: 'New option', price: 0, entry: true }); commit(); },
  prDel: el => { if (S.pricing.length <= 1) return toast('Keep at least one price.'); S.pricing = S.pricing.filter(p => p.id !== el.dataset.id); commit(); },
  logoReset: () => { S.logo = 'asset:logo'; commit(); },
  posterDel: el => { S.posters.splice(+el.dataset.i, 1); commit(); },
  posterReset: () => { S.posters = ['asset:kitsPoster', 'asset:pricingPoster']; commit(); },
  exportData: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    const slug = S.event.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    a.href = URL.createObjectURL(blob);
    a.download = `${slug || 'tournament'}-backup-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('💾 Backup saved — check your Downloads folder and copy it to the USB stick.');
  },
  resetPlayers: () => { if (!confirm('Remove ALL contestants and reset the tournament?')) return; S.players = []; S.draw.log = []; S.draw.live = null; Object.assign(S.t, { stage: 'setup', swiss: null, elim: null, participants: [], dropped: [] }); commit(); },
  factoryReset: () => { if (!confirm('Erase EVERYTHING and go back to the original Halloween setup?')) return; if (!confirm('Really erase everything? This cannot be undone.')) return; S = defaultState(); commit(); toast('Everything reset'); },
};
const CHG = {
  pName: el => { const p = playerById(el.dataset.id); const v = el.value.trim(); if (p && v) { p.name = v; commit(); } else render(); },
  pTier: el => { playerById(el.dataset.id).tier = el.value; commit(); },
  pPaid: el => { playerById(el.dataset.id).paid = el.checked; commit(); },
  pKit: el => {
    const p = playerById(el.dataset.id), v = el.value || null, o = v && ownerOf(v);
    if (o && o.id !== p.id) { if (!confirm(`${o.name} already has that kit. Give it to ${p.name} instead? (${o.name} will have no kit)`)) return render(); o.kitId = null; }
    p.kitId = v; commit();
  },
  drawFor: el => { drawForSel = el.value; render(); },
  removeDrawn: el => { S.draw.removeDrawn = el.checked; commit(); },
  kName: el => { const k = kitById(el.dataset.id); const v = el.value.trim(); if (k && v) { k.name = v; commit(); } else render(); },
  kImg: el => withImage(el, 420, .86, d => { kitById(el.dataset.id).img = d; }),
  logoImg: el => withImage(el, 360, .88, d => { S.logo = d; }),
  posterAdd: el => withImage(el, 1100, .82, d => { S.posters.push(d); }),
  tSet: el => { const k = el.dataset.k; S.t[k] = ['swissRounds', 'cut', 'bestOf'].includes(k) ? Math.max(0, +el.value || 0) : el.value; if (k === 'swissRounds') S.t[k] = Math.max(1, S.t[k]); commit(); },
  ev: el => { const k = el.dataset.k; S.event[k] = k === 'maxSlots' ? Math.max(2, +el.value || 2) : el.value; commit(); },
  pr: el => { const p = S.pricing.find(x => x.id === el.dataset.id); const k = el.dataset.k; p[k] = k === 'entry' ? el.checked : k === 'price' ? (+el.value || 0) : el.value; commit(); },
  importData: el => {
    const f = el.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!data || !Array.isArray(data.kits) || !Array.isArray(data.players)) throw new Error('bad file');
        if (!confirm(`Load "${data.event?.name || 'backup'}" with ${data.players.length} contestants? This replaces what's here now.`)) return;
        localStorage.setItem(KEY, JSON.stringify(data)); S = load(); lastLiveSeq = S.draw.live?.seq || null; commit(); toast('📂 Backup loaded');
      } catch (e) { toast('⚠️ That doesn\'t look like a tournament backup file.', true); }
    };
    fr.readAsText(f);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newName') ACT.addPlayer(); });

/* live sync between the admin window and the TV window */
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const champBefore = elimChampion();
  S = load();
  const live = S.draw.live;
  if (live && live.seq !== lastLiveSeq) { lastLiveSeq = live.seq; playLive(live, false); return; }
  if (spinning) { pendingRender = true; return; }
  if (modalKind === 'match') return;
  render();
  const champ = elimChampion();
  if (champ && champ !== champBefore && isDisplay()) celebrate(champ);
});

render();
</script>
